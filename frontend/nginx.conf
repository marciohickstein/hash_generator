server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # API do backend. Mantem a mesma lista de rotas que o proxy do Vite atendia.
    location ~ ^/(md5|sha1|sha256|sha512|encode|decode|encode_url|decode_url|connect|lan|externalip|ping)$ {
        proxy_pass http://backend:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Equivalente ao removeHeader('origin') que o proxy do Vite fazia.
        proxy_set_header Origin "";
    }

    # Assets do build carregam hash no nome, entao podem ser cacheados pra sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sem router no client, entao path desconhecido e 404 mesmo.
    location / {
        try_files $uri $uri/ =404;
    }
}
