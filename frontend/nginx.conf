# Limita o teste de porta (/connect) por IP, pra que o servidor nao vire
# um scanner de portas. limit_req_zone precisa ficar no contexto http,
# que e onde o nginx inclui este arquivo (conf.d/*.conf).
limit_req_zone $binary_remote_addr zone=connect_limit:10m rate=10r/m;
limit_req_status 429;

# Cache-Control via map pra nao usar add_header dentro de location: o nginx
# descarta os add_header do server quando a location tem os seus.
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # jsdelivr: CSS e fontes do bootstrap-icons.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # API do backend. Mantem a mesma lista de rotas que o proxy do Vite atendia.
    location ~ ^/(md5|sha1|sha256|sha512|encode|decode|externalip|ping)$ {
        include /etc/nginx/backend_proxy.conf;
    }

    # Teste de porta: 10 requisicoes/min por IP, com rajada de ate 5.
    location = /connect {
        limit_req zone=connect_limit burst=5 nodelay;
        include /etc/nginx/backend_proxy.conf;
    }

    # Assets do build carregam hash no nome, entao podem ser cacheados pra sempre.
    location /assets/ {
        try_files $uri =404;
    }

    # Sem router no client, entao path desconhecido e 404 mesmo.
    location / {
        try_files $uri $uri/ =404;
    }
}
