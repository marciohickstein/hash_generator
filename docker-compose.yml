services:
  frontend:
    build:
      context: ./frontend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    ports:
      - "8888:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
    # Sem "ports": o backend so e acessivel pela rede interna do Docker,
    # via proxy do nginx do frontend (que aplica o rate limit).
    environment:
      - NODE_ENV=production
    restart: always
