version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8888:8888"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    ports:
      - "3003:3003"
    environment:
      - ALLOWED_ORIGINS
    volumes:
      - ./backend:/app
      - /app/node_modules
